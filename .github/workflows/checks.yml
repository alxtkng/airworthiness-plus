name: Checks

on:
  pull_request:
  push:
    branches: [main]
  # Once a week, so that a vulnerability published while the repository is quiet
  # is still found (operations/vulnerability-management.md).
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, Types, Lint, Dependencies, Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Pinned to a digest, not a moving tag (threat TH-061). No password is
        # set or stored: the database exists only for this job and accepts
        # connections from it alone.
        image: postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AIRWORTHINESS_DATABASE_NAME: airworthiness
      AIRWORTHINESS_DATABASE_USER: postgres
      AIRWORTHINESS_DATABASE_HOST: localhost
      AIRWORTHINESS_DATABASE_PORT: "5432"
    steps:
      # Actions are pinned to a commit, not a moving tag (threat TH-061).
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.11.32"

      - name: Install Dependencies From the Lock File
        # --locked fails if uv.lock is out of date; hashes are verified on install (TH-060).
        run: uv sync --locked

      - name: Make a Signing Key for This Run
        # Generated here and never stored, so no key is in the repository (TH-063).
        run: echo "AIRWORTHINESS_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type Check
        run: uv run mypy

      - name: Test
        # Runs against the PostgreSQL service above.
        run: uv run pytest

      - name: Install Locked Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Live Playwright Journeys
        env:
          AIRWORTHINESS_E2E: "1"
          AIRWORTHINESS_E2E_POSTGRES: host=127.0.0.1 dbname=postgres user=postgres port=5432
          AIRWORTHINESS_E2E_FULL: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: uv run pytest tests/e2e -rx

      - name: Dependency Vulnerability Scan
        run: |
          uv export --locked --no-emit-project --format requirements.txt -o requirements-audit.txt
          uv run pip-audit --require-hashes --disable-pip -r requirements-audit.txt

      - name: Secret Scan
        # Fails on any secret not already recorded in the baseline (TH-063).
        run: git ls-files -z | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline --exclude-files '^uv\.lock$'

      - name: Traceability Matrix Is Complete
        run: uv run python tools/check_traceability.py

      - name: Build the Service Image
        # The image the server runs (operations/deployment.md). It must build from the
        # lock file alone, hold the static files and no source control folder, and run
        # as a user that owns nothing (OWASP ASVS 5.0, 13.4.1).
        run: |
          docker build --tag airworthiness-plus:check .
          docker run --rm airworthiness-plus:check sh -c 'test ! -e /app/.git && test -f /app/static/interface/app.css && test -f /app/static/interface/fonts/Geist-Variable.woff2 && test "$(id -u)" = 10001 && gunicorn --version'

      - name: Software Bill of Materials
        run: uv export --locked --no-dev --format cyclonedx1.5 -o sbom.cdx.json

      - name: Keep Software Bill of Materials
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: software-bill-of-materials
          path: sbom.cdx.json
          retention-days: 90
