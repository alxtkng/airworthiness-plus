{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<h1>{{ heading }}</h1>
<p><a href="{% url back aircraft.id %}">{{ aircraft.registration }}</a>{% if subject %} · {{ subject }}{% endif %}</p>
<form method="post">
{% csrf_token %}
{% error_summary form %}{{ form.as_p }}
<p><button type="submit">{{ heading }}</button></p>
</form>
{% endblock %}
