{% extends "base.html" %}
{% load static %}
{% block scripts %}<script src="{% static 'interface/passkeys.js' %}" defer></script>{% endblock %}
{% block title %}Sign In{% endblock %}
{% block content %}
<h1>Sign In</h1>
{% if failed %}<p role="alert">User Name or Password Not Accepted</p>{% endif %}
<form method="post" autocomplete="on">
{% csrf_token %}
<p><label for="username">User Name</label><br>
<input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus required maxlength="254"></p>
<p><button type="button" class="primary" data-passkey="sign-in" data-url="{% url 'passkey_sign_in' %}" hidden>Sign In with a Passkey</button></p>
<p data-passkey-message role="alert" hidden></p>
<h2>Use a Password and Authenticator Code</h2>
<p><label for="password">Password</label><br>
<input id="password" name="password" type="password" autocomplete="current-password" required></p>
<p><button type="submit">Continue</button></p>
</form>
{% endblock %}
