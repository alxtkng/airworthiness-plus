<form method="post" action="{% url address component.id %}">
{% csrf_token %}
{% if form.non_field_errors %}<p role="alert">{{ form.non_field_errors|join:", " }}</p>{% endif %}
{% for field in form %}
<p>{{ field.label_tag }}<br>{{ field }}{% if field.help_text %} <span>{{ field.help_text }}</span>{% endif %}{% if field.errors %} <span role="alert">{{ field.errors|join:", " }}</span>{% endif %}</p>
{% endfor %}
<p><button type="submit">{{ button }}</button></p>
</form>
