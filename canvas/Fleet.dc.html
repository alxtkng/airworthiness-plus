<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Aircraft</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Geist Sans Embedded";src:url("/_blob/d039f9457dfa163de154da5ccb5ef1ce") format("woff2");font-weight:100 900;font-style:normal;font-display:block}
@font-face{font-family:"Geist Mono Embedded";src:url("/_blob/cbad824f95366da895c21559ece6cd03") format("woff2");font-weight:100 900;font-style:normal;font-display:block}
body{margin:0}
a{text-decoration:none}
tbody tr:last-child > td{border-bottom-color:transparent !important}
.skip{position:absolute;left:16px;top:-100px;z-index:1;padding:8px 16px;border-radius:6px;background:var(--focus);color:var(--skip-ink);font-size:14px;text-decoration:none}
.skip:focus{top:8px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</helmet>
<div style="--focus: {{t.text}}; --skip-ink: {{t.bg}}; font-family: 'Geist Sans Embedded', Geist, sans-serif; color: {{t.text}}; background: {{t.bg}}; color-scheme: {{t.scheme}}; font-feature-settings: 'tnum' 1; display: flex; flex-wrap: wrap; align-items: stretch; min-height: 100vh">
  <a class="skip" href="#main">Skip to Main Content</a>
  <div style="flex: 1 1 248px; max-width: 100%; display: flex">
    <dc-import name="Sidebar" active="fleet" dark="{{dark}}" hint-size="248px,1100px"></dc-import>
  </div>

  <main id="main" style="flex: 999 1 640px; min-width: 0; box-sizing: border-box; padding: 32px 40px 64px; display: flex; flex-direction: column; gap: 40px">
    <dc-import name="TopBar" trail="Continuing Airworthiness=Fleet.dc.html|Aircraft" line="false" dark="{{dark}}" hint-size="1100px,56px"></dc-import>
    <div style="margin: -36px -40px 0; padding: 0 40px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; box-shadow: inset 0 -1px 0 {{t.border}}">
      <div style="display: contents">

        <h1 style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap" id="table-heading-1">Aircraft</h1>
        <dc-import name="Tabs" set="aircraft" active="fleet" line="false" dark="{{dark}}" hint-size="760px,44px"></dc-import>
      </div>
      <a href="AddAircraft.dc.html" style="font-size: 14px; font-weight: 500; height: 40px; line-height: 40px; box-sizing: border-box; padding: 0 16px; border-radius: 6px; background: {{t.pBg}}; color: {{t.pFg}}; display: inline-block">Add an Aircraft</a>
    </div>

    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px">
      <div role="group" aria-label="Filter aircraft" style="display: inline-flex; flex-wrap: wrap; padding: 3px; border-radius: 6px; background: {{t.empty}}; gap: 2px">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="font: inherit; font-size: 13px; font-weight: 500; height: 32px; padding: 0 12px; border-radius: 6px; border: 0; cursor: pointer; color: {{t.text}}; background: {{f.bg}}; box-shadow: {{f.shadow}}">{{f.label}} <span style="color: {{t.muted}}">{{f.count}}</span></button>
        </sc-for>
      </div>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 400; color: {{t.muted}}">
        <span>Search</span>
        <input type="search" placeholder="Aircraft Registration or Type Rating" style="font: inherit; font-size: 14px; height: 36px; width: 240px; box-sizing: border-box; padding: 0 12px; border-radius: 6px; border: 1px solid {{t.sBorder}}; background: {{t.bg}}; color: {{t.text}}">
      </label>
    </div>

    <div style="overflow-x: auto; border: 1px solid {{t.border}}; border-radius: 6px">
      <table aria-labelledby="table-heading-1" style="width: 100%; min-width: 1000px; border-collapse: collapse; font-size: 14px; line-height: 20px">
        <thead>
          <tr style="background: {{t.sidebar}}; text-align: left; color: {{t.muted}}; font-size: 13px">
            <th scope="col" style="width: 40px; padding: 12px 0 12px 12px; border-bottom: 1px solid {{t.border}}"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Details</span></th>
            <th scope="col" style="padding: 12px 16px; font-weight: 500; white-space: nowrap; border-bottom: 1px solid {{t.border}}">Aircraft Registration</th>
            <th scope="col" style="padding: 12px 16px; font-weight: 500; white-space: nowrap; border-bottom: 1px solid {{t.border}}">Type Rating</th>
            <th scope="col" style="padding: 12px 16px; font-weight: 500; white-space: nowrap; border-bottom: 1px solid {{t.border}}">Status</th>
            <th scope="col" style="padding: 12px 16px; font-weight: 500; white-space: nowrap; border-bottom: 1px solid {{t.border}}">Next Due</th>
            <th scope="col" style="padding: 12px 16px; font-weight: 500; white-space: nowrap; border-bottom: 1px solid {{t.border}}; text-align: right">Remaining</th>
            <th scope="col" style="padding: 12px 16px; font-weight: 500; white-space: nowrap; border-bottom: 1px solid {{t.border}}; text-align: right">Review Certificate Valid To</th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{rows}}" as="a" hint-placeholder-count="6">
            <tr style="background: {{a.bg}}">
              <td style="width: 40px; padding: 10px 0 10px 12px; border-bottom: 1px solid {{a.line}}"><button type="button" aria-expanded="{{a.expanded}}" aria-label="Show Details" onClick="{{a.toggle}}" style="font: inherit; width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate({{a.rot}}); color: {{t.muted}}"><path d="M9 6l6 6-6 6"></path></svg></button></td>
              <td style="padding: 12px 16px; border-bottom: 1px solid {{a.line}}; white-space: nowrap"><a href="{{a.href}}" style="font-weight: 500; color: {{t.text}}">{{a.reg}}</a></td>
              <td style="padding: 12px 16px; border-bottom: 1px solid {{a.line}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px">{{a.type}}</td>
              <td style="padding: 12px 16px; border-bottom: 1px solid {{a.line}}; white-space: nowrap"><span style="display: inline-flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 9999px; background: {{a.colour}}; box-shadow: inset 0 0 0 1px {{t.dotEdge}}; display: inline-block"></span>{{a.status}}</span></td>
              <td style="padding: 12px 16px; border-bottom: 1px solid {{a.line}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px">{{a.next}}</td>
              <td style="padding: 12px 16px; border-bottom: 1px solid {{a.line}}; text-align: right; white-space: nowrap">{{a.remaining}}</td>
              <td style="padding: 12px 16px; border-bottom: 1px solid {{a.line}}; text-align: right; white-space: nowrap">{{a.arc}}</td>
            </tr>
            <sc-if value="{{a.open}}" hint-placeholder-val="{{false}}">
              <tr style="background: {{a.bg}}"><td colspan="7" style="padding: 4px 16px 16px 52px; border-bottom: 1px solid {{t.row}}">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); column-gap: 32px; row-gap: 14px">
                  <sc-for list="{{a.facts}}" as="f" hint-placeholder-count="5"><div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; line-height: 16px; color: {{t.muted}}">{{f.label}}</span><span style="font-size: 14px; line-height: 20px">{{f.value}}</span></div></sc-for>
                  <div style="display: flex; align-items: flex-end"><a href="{{a.href}}" style="font-size: 14px; font-weight: 500; color: {{t.text}}; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: {{t.border}}">Open Aircraft Record</a></div>
                </div>
              </td></tr>
            </sc-if>
          </sc-for>
        </tbody>
      </table>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'all', open: {} }; }
  renderVals() {
    const dark = this.props.dark === true || this.props.dark === 'true';
    const t = dark
      ? { dotEdge: 'transparent', scheme: 'dark', bg: '#0A0A0A', sidebar: '#000000', border: '#2E2E2E', row: '#2E2E2E', text: '#EDEDED', muted: '#A1A1A1', body: '#EDEDED', pBg: '#EDEDED', pFg: '#0A0A0A', sBorder: '#7C7C7C', empty: '#1A1A1A', raised: '#2E2E2E' }
      : { dotEdge: 'rgba(0, 0, 0, 0.45)', scheme: 'light', bg: '#FFFFFF', sidebar: '#FAFAFA', border: '#EBEBEB', row: '#EBEBEB', text: '#171717', muted: '#666666', body: '#171717', pBg: '#171717', pFg: '#FFFFFF', sBorder: '#7D7D7D', empty: '#F2F2F2', raised: '#FFFFFF' };
    const c = { red: '#FF5A4E', amber: '#FFB224', green: '#1FCB6E' };
    const all = [
      { reg: 'G-DGHI', type: 'Piper PA-28 Series (Lycoming)', model: 'PA-28-181 (Archer II)', owner: 'Flying Club', status: 'Unserviceable', colour: c.red, note: 'Stabilator Trim Cable', next: 'Rectify Defect', remaining: 'Grounded', arc: '19 May 2027', hours: '9,874.3', group: 'grounded', soon: true, href: 'Fleet.dc.html' },
      { reg: 'G-EJKL', type: 'Cessna/Reims-Cessna 152/F152 Series (Lycoming)', model: '152', owner: 'Pilot-Owner', status: 'Serviceable', colour: c.green, note: '', next: 'Airworthiness Review', remaining: '18 Days', arc: '6 December 2026', hours: '11,206.8', group: 'ok', soon: true, href: 'Reviews.dc.html' },
      { reg: 'G-ABCD', type: 'Piper PA-28 Series (Lycoming)', model: 'PA-28-140 (Cherokee Cruiser)', owner: 'Pilot-Owner', status: 'Serviceable', colour: c.green, note: '', next: '50-Hour Check', remaining: '12.4 Hours', arc: '14 March 2027', hours: '6,412.6', group: 'ok', soon: true, href: 'Aircraft.dc.html' },
      { reg: 'G-BXYZ', type: 'Cessna/Reims-Cessna 172/F172 Series (Lycoming)', model: '172S', owner: 'Syndicate of 6', status: 'Serviceable', colour: c.green, note: '', next: '100-Hour or Annual Check', remaining: '41.0 Hours', arc: '2 August 2027', hours: '3,318.0', group: 'ok', soon: false, href: 'Fleet.dc.html' },
      { reg: 'G-FMNO', type: 'Grob G115/120 Series (Lycoming)', model: 'G 115', owner: 'Pilot-Owner', status: 'Serviceable', colour: c.green, note: '', next: 'Annual Check', remaining: '78 Days', arc: '27 April 2027', hours: '4,950.2', group: 'ok', soon: false, href: 'Fleet.dc.html' },
      { reg: 'G-CDEF', type: 'Robin DR 400 series (Lycoming)', model: 'DR 400/180', owner: 'Syndicate of 4', status: 'Serviceable', colour: c.green, note: '', next: 'Engine Overhaul', remaining: '220 Hours', arc: '2 December 2027', hours: '7,731.5', group: 'ok', soon: false, href: 'Reviews.dc.html' }
    ];
    const f = this.state.filter;
    const rows = all.filter(a => f === 'all' || (f === 'soon' && a.soon) || (f === 'grounded' && a.group === 'grounded')).map(a => {
      const on = !!this.state.open[a.reg];
      return Object.assign({}, a, { open: on, expanded: on ? 'true' : 'false', rot: on ? '90deg' : '0deg', line: on ? 'transparent' : t.row, bg: on ? t.sidebar : 'transparent',
        toggle: () => { const n = Object.assign({}, this.state.open); n[a.reg] = !n[a.reg]; this.setState({ open: n }); },
        facts: [{ label: 'Type Rating', value: a.type }, { label: 'Owned By', value: a.owner }, { label: 'Airframe Hours', value: a.hours }].concat(a.note ? [{ label: 'Status Reason', value: a.note }] : []) });
    });
    const mk = (key, label, count) => {
      const on = f === key;
      return { label, count: String(count), pressed: on ? 'true' : 'false', bg: on ? t.raised : 'transparent', shadow: on ? '0 1px 2px rgba(0,0,0,0.12)' : 'none', pick: () => this.setState({ filter: key }) };
    };
    const filters = [
      mk('all', 'All', all.length),
      mk('soon', 'Due in 30 Days', all.filter(a => a.soon).length),
      mk('grounded', 'Unserviceable', all.filter(a => a.group === 'grounded').length)
    ];
    return { t, dark, rows, filters };
  }
}
</script>
</body>
</html>
