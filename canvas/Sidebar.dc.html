<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Geist Sans Embedded";src:url("/_blob/d039f9457dfa163de154da5ccb5ef1ce") format("woff2");font-weight:100 900;font-style:normal;font-display:block}
@font-face{font-family:"Geist Mono Embedded";src:url("/_blob/cbad824f95366da895c21559ece6cd03") format("woff2");font-weight:100 900;font-style:normal;font-display:block}
body{margin:0}
a{text-decoration:none}
input::placeholder{color:inherit;opacity:0.75}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
</style>
</helmet>
<nav aria-label="Application" style="--focus: {{t.text}}; font-family: 'Geist Sans Embedded', Geist, sans-serif; color: {{t.text}}; background: {{t.sidebar}}; border-right: 1px solid {{t.border}}; box-sizing: border-box; width: 100%; height: 100%; min-height: 1700px; padding: 16px 12px; display: flex; flex-direction: column; gap: 20px">
  <a href="Home.dc.html" style="padding: 4px 8px; display: flex; align-items: center; gap: 10px; color: {{t.text}}">
    <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 6px; background: {{t.text}}; color: {{t.sidebar}}; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">A+</span>
    <span style="display: flex; flex-direction: column; min-width: 0">
      <span style="font-size: 15px; line-height: 20px; font-weight: 600; letter-spacing: -0.01em">Airworthiness+</span>
      <span style="font-size: 13px; line-height: 18px; color: {{t.muted}}">[Your Organisation]</span>
    </span>
  </a>

  <label style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 6px; border: 1px solid {{t.control}}; background: {{t.field}}; color: {{t.muted}}; font-size: 14px; font-weight: 500">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <span>Search</span>
    <input type="search" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 14px; color: {{t.text}}">
  </label>

  <div style="display: flex; flex-direction: column; gap: 18px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
      <div style="display: flex; flex-direction: column; gap: 1px">
        <sc-if value="{{g.hasLabel}}" hint-placeholder-val="{{true}}">
          <span style="padding: 0 10px 6px; font-size: 13px; line-height: 18px; font-weight: 400; color: {{t.muted}}">{{g.label}}</span>
        </sc-if>
        <sc-for list="{{g.items}}" as="i" hint-placeholder-count="3">
          <a href="{{i.href}}" aria-current="{{i.current}}" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 6px; font-size: 14px; color: {{i.colour}}; font-weight: {{i.weight}}; background: {{i.bg}}; box-shadow: {{i.ring}}">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex: none; color: {{i.iconColour}}"><path d="{{i.icon}}"></path></svg>
            <span style="flex: 1; min-width: 0">{{i.label}}</span>
            <span style="font-size: 13px; font-weight: 500; color: {{t.muted}}; font-family: 'Geist Mono Embedded', 'Geist Mono', monospace">{{i.count}}</span>
          </a>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 1px">
    <sc-for list="{{footer}}" as="i" hint-placeholder-count="2">
      <a href="{{i.href}}" aria-current="{{i.current}}" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 6px; font-size: 14px; color: {{i.colour}}; font-weight: {{i.weight}}; background: {{i.bg}}; box-shadow: {{i.ring}}">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex: none; color: {{i.iconColour}}"><path d="{{i.icon}}"></path></svg>
        <span>{{i.label}}</span>
      </a>
    </sc-for>
    <div style="margin-top: 12px; padding: 12px 10px 0; border-top: 1px solid {{t.border}}; display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 16px; background: {{t.row}}; color: {{t.text}}; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500">YN</span>
      <span style="display: flex; flex-direction: column; min-width: 0">
        <span style="font-size: 14px; line-height: 20px; font-weight: 500">[Your Name]</span>
        <span style="font-size: 12px; line-height: 16px; color: {{t.muted}}">Continuing Airworthiness Manager</span>
      </span>
    </div>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","manuals","mdata","revisions","reading","notices","enquiries","quotes","customers","invoices","orgchart","recurrent","exams","type","crs","contracts","occurrences","suppliers","auth","approval","exposition","changes","oversight","marketplace","wp","fleet","defects","programmes","directives","mods","reliability","weighing","transfers","components","received","stores","quarantine","reviews","aircraft","hazards","reports","audit","actions","plan","load","roster","tools","tool","providers","alt","need","staff","recency","logbook","ojt","competence","assessment","org","plansettings","display","guide"],"default":"home"},"approval":{"editor":"enum","options":["all","owner","cao","camo","145"],"default":"all"},"dark":{"editor":"boolean","default":false},"$preview":{"width":248,"height":1900}}'>
class Component extends DCLogic {
  renderVals() {

    const t = dark

    const active = this.props.active || 'home';
    const icons = {

    const approval = this.props.approval || 'all';
    const show = who => approval === 'all' || who.indexOf(approval) !== -1;
    const ALL = ['owner', 'cao', 'camo', '145'], ORG = ['cao', 'camo', '145'], MNT = ['cao', '145'];
    const item = (keys, label, href, icon, count, who) => {

      return { who: who || ALL, label, href, count: count || '', icon: icons[icon], current: on ? 'page' : 'false', colour: on ? t.text : t.nav, iconColour: on ? t.text : t.muted, weight: '400', bg: on ? t.active : 'transparent', ring: on ? '0 0 0 1px ' + t.border : 'none' };

    const all = [
      { label: '', items: [item(['home'], 'Dashboard', 'Home.dc.html', 'home')] },
      { label: 'Continuing Airworthiness', items: [

        item(['actions'], 'Actions', 'Actions.dc.html', 'actions', '9', ORG)

        item(['plan', 'load', 'roster'], 'Manhours and Capacity', 'Plan.dc.html', 'planning', '', MNT)
      ] },
      { label: 'Logistics', items: [
        item(['received'], 'Goods In', 'PartsReceived.dc.html', 'goodsin', '2', MNT),

      { label: 'Training', items: [
        item(['recurrent'], 'Recurrent Training', 'RecurrentTraining.dc.html', 'repeat', '2', ORG),
        item(['exams', 'logbook', 'type', 'ojt'], 'Aircraft Maintenance Licence', 'BasicExaminations.dc.html', 'training', '', ORG),
        item(['competence', 'assessment'], 'Competency Assessments', 'Competence.dc.html', 'audit', '', ORG)
      ] },
      { label: 'Documentation', items: [
        item(['manuals', 'exposition'], 'Manuals and Procedures', 'Manuals.dc.html', 'manual', '', ORG),

    const footer = [
      item(['org', 'plansettings', 'display'], 'Settings', 'Settings.dc.html', 'settings'),
      item(['guide'], 'Help', 'Guide.dc.html', 'help')

    groups.forEach(g => { g.hasLabel = g.label !== ''; });
    return { t, groups, footer };

</script>
</body>
</html>
