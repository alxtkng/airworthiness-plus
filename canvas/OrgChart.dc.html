<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Organisation Chart</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Geist Sans Embedded";src:url("/_blob/d039f9457dfa163de154da5ccb5ef1ce") format("woff2");font-weight:100 900;font-style:normal;font-display:block}
@font-face{font-family:"Geist Mono Embedded";src:url("/_blob/cbad824f95366da895c21559ece6cd03") format("woff2");font-weight:100 900;font-style:normal;font-display:block}
body{margin:0}
a{text-decoration:none}
tbody tr:last-child > td{border-bottom-color:transparent !important}
ol > li:last-child{border-bottom-color:transparent !important}
</style>
</helmet>
<div style="font-family: 'Geist Sans Embedded', Geist, sans-serif; color: {{t.text}}; background: {{t.bg}}; color-scheme: {{t.scheme}}; font-feature-settings: 'tnum' 1; display: flex; flex-wrap: wrap; align-items: stretch; min-height: 100vh">
  <div style="flex: 1 1 248px; max-width: 100%; display: flex">
    <dc-import name="Sidebar" active="orgchart" dark="{{dark}}" hint-size="248px,1300px"></dc-import>
  </div>
  <main style="flex: 999 1 640px; min-width: 0; box-sizing: border-box; padding: 32px 40px 64px; display: flex; flex-direction: column; gap: 40px">
    <dc-import name="TopBar" trail="People=Staff.dc.html|Staff" line="false" dark="{{dark}}" hint-size="1100px,56px"></dc-import>
    <h1 style="position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Organisation Chart</h1>
    <div style="margin-top: -36px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; margin-left: -40px; margin-right: -40px; padding: 0 40px; box-shadow: inset 0 -1px 0 {{t.border}}">
      <dc-import name="Tabs" set="staff" active="orgchart" line="false" dark="{{dark}}" hint-size="760px,44px"></dc-import>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 0"><button type="button" style="font: inherit; font-size: 14px; font-weight: 500; height: 40px; padding: 0 16px; border-radius: 6px; border: 1px solid {{t.sBorder}}; background: {{t.bg}}; color: {{t.text}}; cursor: pointer">Edit Chart</button></div>
    </div>

    <section aria-labelledby="chart-h" style="display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 12px">
        <h2 id="chart-h" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; letter-spacing: -0.32px">Chains of Responsibility</h2>
        <span style="font-size: 13px; line-height: 18px; color: {{t.muted}}">Exposition Chapter A.8, Revision 7</span>
      </div>
      <div role="tree" aria-label="Organisation Chart" style="display: flex; flex-direction: column; align-items: center">
        <div role="treeitem" aria-level="1" style="width: 300px"><div style="border: 1px solid {{t.border}}; border-radius: 6px; padding: 12px 16px; background: {{t.bg}}; display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; font-weight: 500">{{top.name}}</span>
            <span style="font-size: 13px; line-height: 18px; color: {{t.muted}}">{{top.role}}</span>
            <span style="font-size: 13px; line-height: 18px; color: {{t.muted}}; display: {{top.empShow}}">Contracted</span>
          </div></div>
        <div aria-hidden="true" style="width: 1px; height: 24px; background: {{t.sBorder}}"></div>
        <div style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px">
          <sc-for list="{{teams}}" as="m" hint-placeholder-count="3">
            <div role="group" style="display: flex; flex-direction: column; align-items: stretch; min-width: 0">
              <div aria-hidden="true" style="position: relative; height: 24px"><div style="position: absolute; top: 0; left: {{m.l}}; right: {{m.r}}; border-top: 1px solid {{t.sBorder}}"></div><div style="position: absolute; top: 0; left: 50%; width: 1px; height: 24px; background: {{t.sBorder}}"></div></div>
              <div role="treeitem" aria-level="2"><div style="border: 1px solid {{t.border}}; border-radius: 6px; padding: 12px 16px; background: {{t.bg}}; display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; font-weight: 500">{{m.name}}</span>
            <span style="font-size: 13px; line-height: 18px; color: {{t.muted}}">{{m.role}}</span>
            <span style="font-size: 13px; line-height: 18px; color: {{t.muted}}; display: {{m.empShow}}">Contracted</span>
          </div></div>
              <div style="margin-left: 20px; padding-left: 20px; border-left: 1px solid {{t.sBorder}}; display: flex; flex-direction: column; gap: 12px; padding-top: 12px">
                <sc-for list="{{m.people}}" as="p" hint-placeholder-count="4">
                  <div role="treeitem" aria-level="3"><div style="border: 1px solid {{t.border}}; border-radius: 6px; padding: 12px 16px; background: {{t.bg}}; display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; font-weight: 500"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 9999px; background: {{p.colour}}; display: {{p.mark}}; flex: none"></span>{{p.name}}</span>
            <span style="font-size: 13px; line-height: 18px; color: {{t.muted}}">{{p.role}}</span>
            <span style="font-size: 13px; line-height: 18px; color: {{t.muted}}; display: {{p.empShow}}">Contracted</span>
          </div></div>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </section>

    <section aria-labelledby="np-h" style="display: flex; flex-direction: column; gap: 16px">
      <h2 id="np-h" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; letter-spacing: -0.32px">Management Personnel</h2>
      <div style="overflow-x: auto; border: 1px solid {{t.border}}; border-radius: 6px">
        <table style="width: 100%; min-width: 900px; border-collapse: collapse; font-size: 14px; line-height: 20px; white-space: nowrap">
          <thead><tr style="background: {{t.sidebar}}; color: {{t.muted}}; font-size: 13px; text-align: left">
            <th scope="col" style="padding: 12px 16px; font-weight: 500; border-bottom: 1px solid {{t.border}}">Role</th>
            <th scope="col" style="padding: 12px 16px; font-weight: 500; border-bottom: 1px solid {{t.border}}">Responsible For</th>
            <th scope="col" style="padding: 12px 16px; font-weight: 500; border-bottom: 1px solid {{t.border}}">Reports To</th>
            <th scope="col" style="padding: 12px 16px; font-weight: 500; border-bottom: 1px solid {{t.border}}">Point</th>
          </tr></thead>
          <tbody>
            <sc-for list="{{mgmt}}" as="r" hint-placeholder-count="4"><tr>
              <td style="padding: 12px 16px; border-bottom: 1px solid {{t.row}}; font-weight: 500">{{r.role}}</td>
              <td style="padding: 12px 16px; border-bottom: 1px solid {{t.row}}">{{r.what}}</td>
              <td style="padding: 12px 16px; border-bottom: 1px solid {{t.row}}">{{r.to}}</td>
              <td style="padding: 12px 16px; border-bottom: 1px solid {{t.row}}">{{r.point}}</td>
            </tr></sc-for>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = {}; }
  renderVals() {
    const dark = this.props.dark === true || this.props.dark === 'true';
    const t = dark
      ? { scheme: 'dark', bg: '#0A0A0A', sidebar: '#000000', border: '#2E2E2E', row: '#2E2E2E', text: '#EDEDED', muted: '#A1A1A1', body: '#EDEDED', pBg: '#EDEDED', pFg: '#0A0A0A', sBorder: '#2E2E2E', empty: '#1A1A1A', raised: '#2E2E2E' }
      : { scheme: 'light', bg: '#FFFFFF', sidebar: '#FAFAFA', border: '#EBEBEB', row: '#EBEBEB', text: '#171717', muted: '#666666', body: '#171717', pBg: '#171717', pFg: '#FFFFFF', sBorder: '#EBEBEB', empty: '#F2F2F2', raised: '#FFFFFF' };
    const C = { a: '#FFB224', r: '#FF5A4E' };
    const PEOPLE = [{"id": "am", "name": "[Accountable Manager]", "detail": "Signs the Exposition Statement", "role": "Accountable Manager", "group": "management", "to": "", "emp": "Employed", "lic": "", "auth": ["Not Required", "", ""], "trn": ["Current", "Safety Training", ""], "log": "", "toName": ""}, {"id": "cam", "name": "[Continuing Airworthiness Manager]", "detail": "Nominated Person, Exposition Chapter A.7", "role": "Continuing Airworthiness Manager", "group": "management", "to": "am", "emp": "Employed", "lic": "", "auth": ["Maintenance Programme Approval", "Exposition Chapter A.11", ""], "trn": ["Current", "Safety Training", ""], "log": "", "toName": "Accountable Manager"}, {"id": "mm", "name": "[Maintenance Manager]", "detail": "Nominated Person, Exposition Chapter A.7", "role": "Maintenance Manager", "group": "management", "to": "am", "emp": "Employed", "lic": "", "auth": ["Not Required", "", ""], "trn": ["Current", "Safety Training", ""], "log": "", "toName": "Accountable Manager"}, {"id": "cmm", "name": "[Compliance Monitoring Manager]", "detail": "Independent of the Work Monitored", "role": "Compliance Monitoring Manager", "group": "management", "to": "am", "emp": "Employed", "lic": "", "auth": ["Not Required", "", ""], "trn": ["Current", "Safety Training", ""], "log": "", "toName": "Accountable Manager"}, {"id": "lg", "name": "Lucy Grant", "detail": "Accepted by the Civil Aviation Authority 9 June 2023", "role": "Airworthiness Review Staff", "group": "review", "to": "cam", "emp": "Employed", "lic": "", "auth": ["Airworthiness Review", "Last Review 11 November 2026, G-CDEF", ""], "trn": ["Current", "Continuation Training", ""], "log": "", "toName": "Continuing Airworthiness Manager"}, {"id": "ar2", "name": "[Name]", "detail": "Last Review 2 December 2025, G-EJKL", "role": "Airworthiness Review Staff", "group": "review", "to": "cam", "emp": "Employed", "lic": "", "auth": ["Recency Lapses 2 December 2026", "1 Review in 12 Months Needed", "a"], "trn": ["Human Factors Overdue", "Due 30 October 2026", "r"], "log": "", "toName": "Continuing Airworthiness Manager"}, {"id": "pl", "name": "[Name]", "detail": "Joined 1 September 2026", "role": "Planning and Records", "group": "other", "to": "mm", "emp": "Employed", "lic": "", "auth": ["Competency Assessment in Progress", "Before Unsupervised Work", ""], "trn": ["Initial Safety Training Due 1 March 2027", "Within 6 Months of Joining", ""], "log": "", "toName": "Maintenance Manager"}, {"id": "cm", "name": "Chris Moore", "detail": "UK.66.[Number]", "role": "Certifying Staff", "group": "certifying", "to": "mm", "emp": "Employed", "lic": "Part-66 B1.2", "auth": ["Certifying Staff", "Piston Aeroplanes, Lycoming and Continental Piston Engines", ""], "trn": ["Due 14 August 2027", "Human Factors, Fuel Tank Safety", ""], "log": "Open", "toName": "Maintenance Manager"}, {"id": "sp", "name": "Sam Patel", "detail": "UK.66.[Number]", "role": "Certifying Staff", "group": "certifying", "to": "mm", "emp": "Employed", "lic": "Part-66 B1.2", "auth": ["Certifying Staff", "Piston Aeroplanes, Lycoming and Continental Piston Engines", ""], "trn": ["Due 6 December 2026", "18 Days Left", "a"], "log": "Open", "toName": "Maintenance Manager"}, {"id": "l2", "name": "[Name]", "detail": "UK.66.[Number]", "role": "Certifying Staff", "group": "certifying", "to": "mm", "emp": "Contracted", "lic": "Part-66 L2", "auth": ["Lapsed", "Under 6 Months of Experience in 2 Years", "r"], "trn": ["Due 2 May 2027", "Human Factors", ""], "log": "Open", "toName": "Maintenance Manager"}, {"id": "ce", "name": "[Contract Engineer]", "detail": "UK.66.[Number]", "role": "Certifying Staff", "group": "certifying", "to": "mm", "emp": "Contracted", "lic": "Part-66 B1.2", "auth": ["Not Yet Issued", "Contracted Cover From December 2026", ""], "trn": ["Before Authorisation", "Human Factors, Procedures", ""], "log": "", "toName": "Maintenance Manager"}, {"id": "ew", "name": "Ellie Ward", "detail": "Joined 6 January 2025", "role": "Mechanic, Trainee", "group": "other", "to": "mm", "emp": "Employed", "lic": "Working Toward Part-66 B1.2", "auth": ["Supervised Work Only", "On the Job Training, 31 of 40 Tasks", ""], "trn": ["Current", "Human Factors", ""], "log": "Open", "toName": "Maintenance Manager"}, {"id": "ia", "name": "[Independent Auditor]", "detail": "Internal Audits, Cycle Ending 30 November 2026", "role": "Auditor", "group": "other", "to": "cmm", "emp": "Contracted", "lic": "", "auth": ["Not Required", "", ""], "trn": ["Not Required", "", ""], "log": "", "toName": "Compliance Monitoring Manager"}];
    const card = p => ({ name: p.name, role: p.role, empShow: p.emp === 'Contracted' ? 'block' : 'none', colour: C[p.auth[2]] || C[p.trn[2]] || 'transparent', mark: (p.auth[2] || p.trn[2]) ? 'inline-block' : 'none' });
    const top = card(PEOPLE.find(p => p.id === 'am'));
    const order = ['cam', 'mm', 'cmm'];
    const teams = order.map((id, i) => Object.assign(card(PEOPLE.find(p => p.id === id)), {
      l: i === 0 ? '50%' : '-16px', r: i === order.length - 1 ? '50%' : '-16px',

    return { t, dark, top, teams, mgmt };

}
</script>
