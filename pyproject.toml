[project]
name = "airworthiness-plus"
version = "0.1.0"
description = "Continuing airworthiness records for the United Kingdom"
license = "AGPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "whitenoise>=6.8,<7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "mypy>=1.13",
    "ruff>=0.8",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
    "django-stubs>=5.2,<5.3",
    "pytest-django>=4.9",
    "playwright>=1.63",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airworthiness_rules", "src/airworthiness_plus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
DJANGO_SETTINGS_MODULE = "airworthiness_plus.settings"
# The static files are gathered when the service is built, not for the tests.
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.mypy]
strict = true
files = ["src", "tests", "tools", "manage.py"]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "airworthiness_plus.settings"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "tools"]
extend-exclude = ["scripts", "canvas", "data", "research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Django declares models, migrations and settings as class attributes.
"src/airworthiness_plus/**" = ["RUF012"]
# Migrations are generated by Django and carry long choice labels.
"src/airworthiness_plus/**/migrations/*" = ["RUF012", "E501"]
# The SQL is built from fixed text and checked identifiers, never from input.
"src/airworthiness_plus/history/sql.py" = ["S608"]
