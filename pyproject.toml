[project]
name = "airworthiness-plus"
version = "0.1.0"
description = "Continuing airworthiness records for the United Kingdom"
license = "AGPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "mypy>=1.13",
    "ruff>=0.8",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airworthiness_rules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.mypy]
strict = true
files = ["src", "tests", "tools"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "tools"]
extend-exclude = ["scripts", "canvas", "data", "research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
